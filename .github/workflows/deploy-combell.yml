# Push naar main op GitHub -> automatisch publiceren op Combell.
#
# Combell's autogit trekt NIET uit GitHub: het is een losse bare repo op het
# hostingpakket die op een push reageert. Iemand moet er dus naartoe duwen. Deze
# workflow doet dat, zodat jij enkel nog naar GitHub hoeft te pushen.
#
# De branch bepaalt de site: HEAD:master -> de hoofdsite (sievax.academy).
# Wil je een release eerst op staging.sievax.academy zien, push dan lokaal
# `git push combell main:staging` — dat blijft handwerk, met opzet.

name: Deploy naar Combell

on:
  push:
    branches: [main]
  workflow_dispatch:      # knop in de Actions-tab om handmatig te herdeployen

concurrency:
  group: deploy-combell   # nooit twee deploys tegelijk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # autogit wil de volledige historiek, geen shallow clone

      - name: SSH-sleutel klaarzetten
        env:
          KEY: ${{ secrets.COMBELL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.COMBELL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # De hostsleutel komt uit een secret, niet uit ssh-keyscan: anders
          # vertrouwt de runner blind wat er die dag antwoordt.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Publiceren
        run: |
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes'
          git push sievaxbe@ssh083.webhosting.be:auto.git HEAD:master
